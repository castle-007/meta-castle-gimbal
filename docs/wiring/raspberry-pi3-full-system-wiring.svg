<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="1900" viewBox="0 0 3200 1900">
  <defs>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 16px Arial, sans-serif; fill: #4b5563; }
      .label { font: 700 22px Arial, sans-serif; fill: #111827; }
      .text { font: 16px Arial, sans-serif; fill: #111827; }
      .small { font: 13px Arial, sans-serif; fill: #4b5563; }
      .box { fill: #ffffff; stroke: #111827; stroke-width: 2; rx: 12; }
      .pi { fill: #eef2ff; stroke: #4338ca; stroke-width: 2; rx: 12; }
      .sensor { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 12; }
      .camera { fill: #f5f3ff; stroke: #6d28d9; stroke-width: 2; rx: 12; }
      .button { fill: #f8fafc; stroke: #0f172a; stroke-width: 2; rx: 12; }
      .level { fill: #ecfdf5; stroke: #047857; stroke-width: 2; rx: 12; }
      .driver { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 12; }
      .motor { fill: #faf5ff; stroke: #7c3aed; stroke-width: 2; rx: 12; }
      .power { fill: #fef2f2; stroke: #b91c1c; stroke-width: 2; rx: 12; }
      .pin { fill: #ffffff; stroke: #9ca3af; stroke-width: 1; rx: 6; }
      .wire-33 { stroke: #16a34a; stroke-width: 4; fill: none; }
      .wire-5v { stroke: #f59e0b; stroke-width: 4; fill: none; }
      .wire-gnd { stroke: #111827; stroke-width: 4; fill: none; }
      .wire-pwm { stroke: #2563eb; stroke-width: 4; fill: none; }
      .wire-dir { stroke: #dc2626; stroke-width: 4; fill: none; }
      .wire-i2c { stroke: #0891b2; stroke-width: 4; fill: none; }
      .wire-csi { stroke: #9333ea; stroke-width: 4; stroke-dasharray: 10 6; fill: none; }
      .wire-btn { stroke: #0f766e; stroke-width: 4; fill: none; }
      .wire-led { stroke: #ca8a04; stroke-width: 4; fill: none; }
      .wire-phase { stroke: #0f766e; stroke-width: 4; fill: none; }
      .arrow { marker-end: url(#arrow); }
      .bg { fill: #f8fafc; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#374151"/>
    </marker>
  </defs>

  <rect width="3200" height="1900" class="bg"/>

  <text x="40" y="52" class="title">Raspberry Pi 3 Full System Wiring</text>
  <text x="40" y="82" class="subtitle">Left: buttons, LED, MPU6050, camera. Center: Raspberry Pi 3. Right: TXS0108E and two ZS-X10 V3.1 BLDC drivers with two motors and external power.</text>

  <!-- Left side blocks -->
  <rect x="120" y="150" width="320" height="250" class="sensor"/>
  <text x="150" y="195" class="label">MPU6050</text>
  <text x="150" y="224" class="small">I2C address 0x68</text>
  <rect x="150" y="265" width="250" height="36" class="pin"/><text x="168" y="289" class="text">VCC -> 3.3V</text>
  <rect x="150" y="308" width="250" height="36" class="pin"/><text x="168" y="332" class="text">GND -> GND</text>
  <rect x="150" y="351" width="250" height="36" class="pin"/><text x="168" y="375" class="text">SDA -> GPIO2</text>
  <rect x="150" y="394" width="250" height="36" class="pin"/><text x="168" y="418" class="text">SCL -> GPIO3</text>

  <rect x="120" y="455" width="320" height="230" class="camera"/>
  <text x="150" y="500" class="label">Camera Module</text>
  <text x="150" y="529" class="small">CSI ribbon cable to Pi</text>
  <rect x="150" y="570" width="250" height="36" class="pin"/><text x="168" y="594" class="text">CSI ribbon -> Pi CSI</text>
  <rect x="150" y="613" width="250" height="36" class="pin"/><text x="168" y="637" class="text">H264 source for record / RTSP</text>

  <rect x="120" y="720" width="320" height="320" class="button"/>
  <text x="150" y="765" class="label">Buttons / LED</text>
  <rect x="150" y="800" width="250" height="34" class="pin"/><text x="168" y="823" class="text">GPIO17 Record button</text>
  <rect x="150" y="842" width="250" height="34" class="pin"/><text x="168" y="865" class="text">GPIO24 Record LED</text>
  <rect x="150" y="884" width="250" height="34" class="pin"/><text x="168" y="907" class="text">GPIO25 Power button</text>
  <rect x="150" y="926" width="250" height="34" class="pin"/><text x="168" y="949" class="text">GPIO27 Video mode button</text>
  <rect x="150" y="968" width="250" height="34" class="pin"/><text x="168" y="991" class="text">Buttons pull to GND, active-low</text>

  <!-- Raspberry Pi -->
  <rect x="1080" y="140" width="480" height="980" class="pi"/>
  <text x="1120" y="188" class="label">Raspberry Pi 3</text>
  <text x="1120" y="218" class="small">Controller + MPU6050 + record / RTSP / power control</text>
  <rect x="1110" y="260" width="420" height="40" class="pin"/><text x="1130" y="286" class="text">3.3V</text>
  <rect x="1110" y="308" width="420" height="40" class="pin"/><text x="1130" y="334" class="text">GND</text>
  <rect x="1110" y="356" width="420" height="40" class="pin"/><text x="1130" y="382" class="text">GPIO2 / SDA1</text>
  <rect x="1110" y="404" width="420" height="40" class="pin"/><text x="1130" y="430" class="text">GPIO3 / SCL1</text>
  <rect x="1110" y="452" width="420" height="40" class="pin"/><text x="1130" y="478" class="text">GPIO12 / PWM0 -> TXS0108E</text>
  <rect x="1110" y="500" width="420" height="40" class="pin"/><text x="1130" y="526" class="text">GPIO13 / PWM1 -> TXS0108E</text>
  <rect x="1110" y="548" width="420" height="40" class="pin"/><text x="1130" y="574" class="text">GPIO20 / DIR0 -> TXS0108E</text>
  <rect x="1110" y="596" width="420" height="40" class="pin"/><text x="1130" y="622" class="text">GPIO21 / DIR1 -> TXS0108E</text>
  <rect x="1110" y="644" width="420" height="40" class="pin"/><text x="1130" y="670" class="text">GPIO17 Record button</text>
  <rect x="1110" y="692" width="420" height="40" class="pin"/><text x="1130" y="718" class="text">GPIO24 Record LED</text>
  <rect x="1110" y="740" width="420" height="40" class="pin"/><text x="1130" y="766" class="text">GPIO25 Power button</text>
  <rect x="1110" y="788" width="420" height="40" class="pin"/><text x="1130" y="814" class="text">GPIO27 Video mode button</text>
  <rect x="1110" y="836" width="420" height="40" class="pin"/><text x="1130" y="862" class="text">CSI camera connector</text>

  <!-- TXS0108E -->
  <rect x="1720" y="150" width="520" height="420" class="level"/>
  <text x="1760" y="198" class="label">TXS0108E</text>
  <text x="1760" y="228" class="small">Level shifter. VB must be 5V.</text>
  <rect x="1760" y="265" width="180" height="42" class="pin"/><text x="1780" y="292" class="text">VCCA = 3.3V</text>
  <rect x="1760" y="315" width="180" height="42" class="pin"/><text x="1780" y="342" class="text">VB = 5V</text>
  <rect x="1760" y="365" width="180" height="42" class="pin"/><text x="1780" y="392" class="text">GND common</text>
  <rect x="1760" y="415" width="180" height="42" class="pin"/><text x="1780" y="442" class="text">OE = 3.3V</text>

  <rect x="1980" y="258" width="230" height="42" class="pin"/><text x="2000" y="286" class="text">PWM0 / DIR0 / PWM1 / DIR1</text>
  <rect x="1980" y="308" width="230" height="42" class="pin"/><text x="2000" y="336" class="text">Pi side inputs</text>
  <rect x="1980" y="358" width="230" height="42" class="pin"/><text x="2000" y="386" class="text">B-side outputs</text>
  <rect x="1980" y="408" width="230" height="42" class="pin"/><text x="2000" y="436" class="text">Pi -> TXS -> ZS-X10</text>

  <rect x="1720" y="620" width="520" height="330" class="driver"/>
  <text x="1760" y="668" class="label">ZS-X10 V3.1 - Roll</text>
  <rect x="1760" y="720" width="180" height="40" class="pin"/><text x="1780" y="746" class="text">PWM0 input</text>
  <rect x="1760" y="768" width="180" height="40" class="pin"/><text x="1780" y="794" class="text">DIR0 input</text>
  <rect x="1760" y="816" width="180" height="40" class="pin"/><text x="1780" y="842" class="text">BRAKE -> 5V</text>
  <rect x="1760" y="864" width="180" height="40" class="pin"/><text x="1780" y="890" class="text">GND common</text>
  <rect x="1980" y="720" width="230" height="40" class="pin"/><text x="2000" y="746" class="text">U / V / W to motor</text>
  <rect x="1980" y="768" width="230" height="40" class="pin"/><text x="2000" y="794" class="text">Hall sensor not used</text>
  <rect x="1980" y="816" width="230" height="40" class="pin"/><text x="2000" y="842" class="text">Sensorless BLDC</text>
  <rect x="1980" y="864" width="230" height="40" class="pin"/><text x="2000" y="890" class="text">Motor power input</text>

  <rect x="2280" y="620" width="520" height="330" class="driver"/>
  <text x="2320" y="668" class="label">ZS-X10 V3.1 - Pitch</text>
  <rect x="2320" y="720" width="180" height="40" class="pin"/><text x="2340" y="746" class="text">PWM1 input</text>
  <rect x="2320" y="768" width="180" height="40" class="pin"/><text x="2340" y="794" class="text">DIR1 input</text>
  <rect x="2320" y="816" width="180" height="40" class="pin"/><text x="2340" y="842" class="text">BRAKE -> 5V</text>
  <rect x="2320" y="864" width="180" height="40" class="pin"/><text x="2340" y="890" class="text">GND common</text>
  <rect x="2540" y="720" width="230" height="40" class="pin"/><text x="2560" y="746" class="text">U / V / W to motor</text>
  <rect x="2540" y="768" width="230" height="40" class="pin"/><text x="2560" y="794" class="text">Hall sensor not used</text>
  <rect x="2540" y="816" width="230" height="40" class="pin"/><text x="2560" y="842" class="text">Sensorless BLDC</text>
  <rect x="2540" y="864" width="230" height="40" class="pin"/><text x="2560" y="890" class="text">Motor power input</text>

  <!-- Motors -->
  <rect x="1720" y="1020" width="520" height="130" class="motor"/>
  <text x="1760" y="1065" class="label">Roll BLDC Motor</text>
  <rect x="1760" y="1098" width="92" height="34" class="pin"/><text x="1796" y="1120" class="text">U</text>
  <rect x="1858" y="1098" width="92" height="34" class="pin"/><text x="1894" y="1120" class="text">V</text>
  <rect x="1956" y="1098" width="92" height="34" class="pin"/><text x="1992" y="1120" class="text">W</text>

  <rect x="2280" y="1020" width="520" height="130" class="motor"/>
  <text x="2320" y="1065" class="label">Pitch BLDC Motor</text>
  <rect x="2320" y="1098" width="92" height="34" class="pin"/><text x="2356" y="1120" class="text">U</text>
  <rect x="2418" y="1098" width="92" height="34" class="pin"/><text x="2454" y="1120" class="text">V</text>
  <rect x="2516" y="1098" width="92" height="34" class="pin"/><text x="2552" y="1120" class="text">W</text>

  <!-- Power -->
  <rect x="2320" y="150" width="360" height="260" class="power"/>
  <text x="2350" y="198" class="label">External Motor Power</text>
  <text x="2350" y="228" class="small">One supply feeds both ZS-X10 boards.</text>
  <rect x="2350" y="270" width="280" height="38" class="pin"/><text x="2370" y="295" class="text">VCC +</text>
  <rect x="2350" y="316" width="280" height="38" class="pin"/><text x="2370" y="341" class="text">GND -</text>
  <rect x="2350" y="362" width="280" height="38" class="pin"/><text x="2370" y="387" class="text">Common to both drivers</text>

  <rect x="2320" y="430" width="360" height="190" class="button"/>
  <text x="2350" y="478" class="label">Logic 5V / Notes</text>
  <rect x="2350" y="520" width="280" height="34" class="pin"/><text x="2370" y="543" class="text">5V -> TXS VB</text>
  <rect x="2350" y="562" width="280" height="34" class="pin"/><text x="2370" y="585" class="text">5V -> BRAKE high</text>

  <!-- Wiring lines: left side -->
  <path class="wire-33" d="M1080 280 C920 280 760 280 440 280"/>
  <path class="wire-gnd" d="M1080 328 C920 328 760 328 440 328"/>
  <path class="wire-i2c" d="M1080 376 C900 376 730 376 440 376"/>
  <path class="wire-i2c" d="M1080 424 C900 424 730 424 440 424"/>
  <path class="wire-csi arrow" d="M1080 836 C850 836 700 620 440 620"/>
  <path class="wire-btn" d="M1080 668 C860 668 720 830 440 830"/>
  <path class="wire-led" d="M1080 716 C860 716 720 870 440 870"/>
  <path class="wire-btn" d="M1080 764 C860 764 720 910 440 910"/>
  <path class="wire-btn" d="M1080 812 C860 812 720 950 440 950"/>
  <path class="wire-gnd" d="M1080 328 C850 328 720 990 440 990"/>

  <!-- Wiring lines: Pi to TXS -->
  <path class="wire-pwm arrow" d="M1500 472 C1580 472 1640 310 1760 286"/>
  <path class="wire-pwm arrow" d="M1500 520 C1580 520 1640 330 1760 286"/>
  <path class="wire-dir arrow" d="M1500 568 C1580 568 1640 380 1760 334"/>
  <path class="wire-dir arrow" d="M1500 616 C1580 616 1640 430 1760 334"/>
  <path class="wire-33" d="M1500 280 C1600 280 1680 280 1760 280"/>
  <path class="wire-5v" d="M1500 280 C1610 280 1680 332 1760 332"/>
  <path class="wire-gnd" d="M1500 328 C1610 328 1680 382 1760 382"/>
  <path class="wire-33" d="M1500 280 C1600 280 1680 430 1760 430"/>

  <!-- Wiring lines: TXS to ZS -->
  <path class="wire-pwm arrow" d="M1760 286 C1860 286 1880 720 1760 740"/>
  <path class="wire-dir arrow" d="M1760 334 C1860 334 1880 768 1760 788"/>
  <path class="wire-5v" d="M1760 332 C1880 332 1920 818 1760 832"/>
  <path class="wire-gnd" d="M1760 382 C1880 382 1920 866 1760 880"/>
  <path class="wire-pwm arrow" d="M1760 286 C2140 286 2160 720 2320 740"/>
  <path class="wire-dir arrow" d="M1760 334 C2140 334 2160 768 2320 788"/>
  <path class="wire-5v" d="M1760 332 C2140 332 2200 818 2320 832"/>
  <path class="wire-gnd" d="M1760 382 C2140 382 2200 866 2320 880"/>

  <!-- Wiring lines: ZS to motors -->
  <path class="wire-phase" d="M2020 900 C2000 980 1980 1040 1940 1098"/>
  <path class="wire-phase" d="M2020 900 C2040 980 2010 1040 2035 1098"/>
  <path class="wire-phase" d="M2020 900 C2080 980 2040 1040 2130 1098"/>
  <path class="wire-phase" d="M2600 900 C2580 980 2560 1040 2408 1098"/>
  <path class="wire-phase" d="M2600 900 C2620 980 2590 1040 2506 1098"/>
  <path class="wire-phase" d="M2600 900 C2660 980 2620 1040 2604 1098"/>

  <!-- Wiring lines: power -->
  <path class="wire-5v arrow" d="M2320 286 C2260 286 2200 286 2140 286"/>
  <path class="wire-gnd" d="M2320 332 C2260 332 2200 332 2140 332"/>
  <path class="wire-5v" d="M2320 286 C2260 286 2200 560 2140 560"/>
  <path class="wire-5v" d="M2320 286 C2260 286 2200 574 2140 574"/>

  <!-- Lower explanation -->
  <rect x="40" y="1200" width="3120" height="640" class="box"/>
  <text x="60" y="1244" class="label">Connection Details</text>
  <text x="60" y="1284" class="text">1. Raspberry Pi 3 is the center controller. The left side contains the MPU6050, camera, buttons, and LED. The right side contains the TXS0108E and the two ZS-X10 driver boards.</text>
  <text x="60" y="1318" class="text">2. The control path for motor speed and direction is always Pi -&gt; TXS0108E -&gt; ZS-X10. The Pi does not drive the driver boards directly.</text>
  <text x="60" y="1352" class="text">3. TXS0108E must be wired with VCCA = 3.3V, VB = 5V, GND common, and OE = 3.3V. VB missing means the 5V side output will not work.</text>
  <text x="60" y="1386" class="text">4. TXS0108E pin names shown in the drawing are PWM0, PWM1, DIR0, and DIR1. These are the four control signals that pass through the level shifter to the two ZS-X10 boards.</text>
  <text x="60" y="1420" class="text">5. Roll control uses GPIO12 / PWM0 and GPIO20 / DIR0. Pitch control uses GPIO13 / PWM1 and GPIO21 / DIR1.</text>
  <text x="60" y="1454" class="text">6. Both ZS-X10 boards share the same external motor power supply. The power negative, Pi GND, TXS GND, and both driver GND pins must be common.</text>
  <text x="60" y="1488" class="text">7. BRAKE on both ZS-X10 boards is tied to 5V for the first test. The board uses active-low brake, so 5V releases the brake.</text>
  <text x="60" y="1522" class="text">8. ZS-X10 internal wiring is explained only here: each board’s U, V, and W output goes to the matching motor U, V, and W phase wires. The motors are sensorless, so the Hall sensor port is not used.</text>
  <text x="60" y="1556" class="text">9. The camera is connected by the CSI ribbon cable, not by GPIO. It is the source for local recording and RTSP streaming.</text>
  <text x="60" y="1590" class="text">10. GPIO17 is the record button, GPIO24 is the record LED, GPIO25 is the power button, and GPIO27 is the video-mode button. All are active-low to GND.</text>
  <text x="60" y="1624" class="text">11. The record LED should use a resistor in series. The LED is used as a status indicator for ready, recording, and wait states.</text>
  <text x="60" y="1658" class="text">12. Roll motor testing showed the stable running threshold is around 40% duty. That value was carried into the software as the minimum operating duty for stable start-up.</text>
  <text x="60" y="1692" class="text">13. This diagram is the project’s current wiring reference and should be kept aligned with the recipe, service, and documentation files.</text>
</svg>
